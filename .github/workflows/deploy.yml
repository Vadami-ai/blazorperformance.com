name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  linkcheck:
    name: Validate all links on the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Crawls every page from the homepage, following internal links, and
      # checks every anchor, image, script, and stylesheet target (internal
      # and external). Fails the workflow on any broken link.
      # Skipped: LinkedIn and X block bots; mailto links are not fetchable.
      - name: Crawl and validate links
        run: >
          npx linkinator@6 https://blazorperformance.com
          --recurse
          --verbosity error
          --timeout 30000
          --retry
          --skip "linkedin\.com|twitter\.com|x\.com|^mailto:"

